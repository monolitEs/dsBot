name: dsbot
services:
  bot:
    image: dsbot:${DEPLOY_SHA:-local}
    build: .
    init: true
    command: ["python", "/app/startBot.py", "${VOICE_ASSISTANT:-false}"]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY to the DeepSeek key}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      GIGAAM_MODEL_DIR: /opt/models/gigaam-ctc
    volumes:
      - type: bind
        source: ${DSBOT_DATA_DIR:?Set DSBOT_DATA_DIR to an absolute path on mercury}
        target: /data
        bind:
          create_host_path: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
